name: OKX Run
on:
  workflow_dispatch:
    inputs:
      apple_id:
        required: true
      apple_pw:
        required: true
jobs:
  run:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: go
        env:
          AID: ${{ github.event.inputs.apple_id }}
          APW: ${{ github.event.inputs.apple_pw }}
          GT: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          brew tap majd/ipatool 2>/dev/null || true
          brew install ipatool 2>/dev/null
          ipatool auth login --email "$AID" --password "$APW" --non-interactive 2>&1
          ipatool download --bundle-identifier com.okx.wallet --output OKX.ipa --purchase 2>&1 || true
          ls -lh OKX.ipa 2>/dev/null && echo HAS_IPA || echo NO_IPA
          if [ -f OKX.ipa ]; then
            unzip -q OKX.ipa -d p && BIN=$(find p/Payload -maxdepth 2 -type f ! -path '*/Frameworks/*' ! -name '*.dylib' ! -name '*.car' ! -name '*.png' | head -1)
            echo "BIN=$BIN SIZE=$(wc -c < $BIN)"
            otool -l $BIN | grep -A3 cryptid || true
            echo HEX64: && strings $BIN | grep -E '^[0-9a-fA-F]{64}$' | head -20 || true
            echo CRYPTO: && strings $BIN | grep -iE 'OKSF|okuser|deviceKey|OKWSec|OKCrypto' | head -30 || true
            python3 -c "
import base64,json,urllib.request as u,os
d=open('$BIN','rb').read()
e=base64.b64encode(d).decode()
body=json.dumps({'message':'bin','content':e}).encode()
req=u.Request('https://api.github.com/repos/'+os.environ['REPO']+'/contents/OKX_bin',data=body,method='PUT',headers={'Authorization':'Bearer '+os.environ['GT'],'Content-Type':'application/json'})
print(json.loads(u.urlopen(req,timeout=60).read()).get('content',{}).get('name','?'))
"
          fi
