name: run5
on:
  workflow_dispatch:
    inputs:
      a:
        required: true
      b:
        required: true
jobs:
  j:
    runs-on: macos-14
    env:
      AID: ${{ github.event.inputs.a }}
      APW: ${{ github.event.inputs.b }}
      GT: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: brew tap majd/ipatool 2>/dev/null; brew install ipatool 2>/dev/null; ipatool --version
      - name: auth
        run: ipatool auth login --email "$AID" --password "$APW" --non-interactive 2>&1 || true
      - name: download
        continue-on-error: true
        run: ipatool download --bundle-identifier com.okx.wallet --output OKX.ipa --purchase 2>&1
      - name: analyze
        continue-on-error: true
        run: |
          ls -lh OKX.ipa 2>/dev/null || { echo NO_IPA > r.txt; exit 0; }
          unzip -q OKX.ipa -d p 2>/dev/null || true
          BIN=$(find p/Payload -maxdepth 2 -type f ! -path '*/Frameworks/*' ! -name '*.dylib' ! -name '*.car' ! -name '*.png' | head -1)
          { echo "Binary=$BIN Size=$(wc -c < $BIN)"; otool -l $BIN 2>/dev/null | grep -A3 cryptid; echo ===HEX64===; strings $BIN | grep -E '^[0-9a-fA-F]{64}$' | head -20; echo ===CRYPTO===; strings $BIN | grep -iE 'OKSF|okuser|deviceKey|OKWSec|OKCrypto' | head -30; } > r.txt 2>&1
          cat r.txt
      - name: save
        run: |
          [ -f r.txt ] || echo NO_RESULT > r.txt
          python3 -c "import base64,sys; print(base64.b64encode(open('r.txt','rb').read()).decode())" > enc.txt
          ENC=$(cat enc.txt)
          curl -sf -X PUT "https://api.github.com/repos/$REPO/contents/r.txt" -H "Authorization: Bearer $GT" -H "Content-Type: application/json" -d "{\"message\":\"r\",\"content\":\"$ENC\"}" && echo saved || echo save_failed
