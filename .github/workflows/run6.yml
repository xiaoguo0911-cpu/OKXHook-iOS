name: run6
on:
  workflow_dispatch:
    inputs:
      a:
        required: true
      b:
        required: true
jobs:
  j:
    runs-on: macos-14
    env:
      AID: ${{ github.event.inputs.a }}
      APW: ${{ github.event.inputs.b }}
      GT: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install ipatool 2>&1 | tail -3

      - name: Try China region login
        run: |
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db 2>/dev/null || true
          # ipatool supports --country flag for region
          ipatool auth login --email "$AID" --password "$APW" --country CN --non-interactive 2>&1 | tee l.log || true
          cat l.log
          echo "---"
          ipatool auth info 2>&1 || true

      - name: Download OKX (CN region)
        run: |
          # Try CN region download
          ipatool download --bundle-identifier com.okx.wallet --country CN --output OKX.ipa 2>&1 | tee d.log || true
          cat d.log
          
          # Try without country
          if [ ! -f OKX.ipa ]; then
            ipatool download --bundle-identifier com.okx.wallet --output OKX.ipa 2>&1 >> d.log || true
          fi
          
          # Try OKX exchange app
          if [ ! -f OKX.ipa ]; then
            ipatool download --bundle-identifier com.okex.OKExAppstoreFull --country CN --output OKX.ipa 2>&1 >> d.log || true
          fi
          
          ls -lh OKX.ipa 2>/dev/null && echo HAS_IPA || echo NO_IPA

      - name: Analyze
        run: |
          { cat l.log 2>/dev/null; echo ---; cat d.log 2>/dev/null; } > r.txt
          if [ ! -f OKX.ipa ]; then echo NO_IPA >> r.txt
          else
            unzip -q OKX.ipa -d p 2>/dev/null || true
            BIN=$(find p/Payload -maxdepth 2 -type f ! -path '*/Frameworks/*' ! -name '*.dylib' ! -name '*.car' ! -name '*.png' | head -1)
            { echo "IPA=$(wc -c < OKX.ipa)"; echo "Bin=$BIN $(wc -c < $BIN)";
              otool -l $BIN 2>/dev/null | grep -A3 cryptid;
              echo ===HEX64===; strings $BIN | grep -E '^[0-9a-fA-F]{64}$' | head -30;
              echo ===CRYPTO===; strings $BIN | grep -iE 'OKSF|okuser|deviceKey|OKWSec|OKCrypto|OKWallet' | head -40; } >> r.txt 2>&1
          fi
          cat r.txt

      - name: Save
        run: |
          [ -f r.txt ] || echo NO_RESULT > r.txt
          python3 -c "import base64; print(base64.b64encode(open('r.txt','rb').read()).decode())" > e.b64
          ENC=$(cat e.b64)
          SHA=$(curl -sf "https://api.github.com/repos/$REPO/contents/r.txt" -H "Authorization: Bearer $GT" | python3 -c "import sys,json;print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
          BODY=$([ -n "$SHA" ] && echo "{\"message\":\"r\",\"content\":\"$ENC\",\"sha\":\"$SHA\"}" || echo "{\"message\":\"r\",\"content\":\"$ENC\"}")
          curl -sf -X PUT "https://api.github.com/repos/$REPO/contents/r.txt" -H "Authorization: Bearer $GT" -H "Content-Type: application/json" -d "$BODY" && echo saved
