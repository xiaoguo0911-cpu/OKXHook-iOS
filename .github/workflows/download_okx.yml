name: Download and Analyze OKX IPA

on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: 'Apple ID (email)'
        required: true
      apple_pw:
        description: 'Apple ID password'
        required: true

jobs:
  download-analyze:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ipatool
        run: |
          set -e
          echo "Downloading ipatool v2.7.0..."
          curl -fsSL \
            "https://github.com/majd/ipatool/releases/download/v2.7.0/ipatool-2.7.0-macos-arm64.tar.gz" \
            -o ipatool.tar.gz
          tar xzf ipatool.tar.gz
          ls -la
          # 找可执行文件
          find . -name "ipatool*" -type f | head -5
          TOOL=$(find . -name "ipatool" -type f | head -1)
          echo "Found: $TOOL"
          chmod +x "$TOOL"
          mv "$TOOL" ./ipatool_bin
          ./ipatool_bin --version

      - name: Login and Download OKX
        run: |
          ./ipatool_bin auth login \
            --email "${{ github.event.inputs.apple_id }}" \
            --password "${{ github.event.inputs.apple_pw }}" \
            --non-interactive 2>&1 | head -20 || true

          echo "--- Downloading OKX Wallet ---"
          ./ipatool_bin download \
            --bundle-identifier com.okx.wallet \
            --output OKX.ipa 2>&1 | head -30 || \
          ./ipatool_bin download \
            --bundle-identifier com.okex.OKExAppstoreFull \
            --output OKX.ipa 2>&1 | head -30 || true

          ls -lh *.ipa 2>/dev/null || echo "Download failed"

      - name: Analyze binary
        run: |
          if [ ! -f OKX.ipa ]; then
            echo "NO_IPA" > result.txt
            exit 0
          fi

          unzip -q OKX.ipa -d payload
          BINARY=$(find payload/Payload -maxdepth 2 -type f \
            ! -path "*/Frameworks/*" \
            ! -name "*.dylib" ! -name "*.car" ! -name "*.png" \
            ! -name "*.strings" ! -name "*.nib" | head -1)

          echo "Binary: $BINARY ($(wc -c < "$BINARY") bytes)" > result.txt
          file "$BINARY" >> result.txt

          echo "" >> result.txt
          echo "=== FairPlay encryption ===" >> result.txt
          otool -l "$BINARY" | grep -A3 cryptid >> result.txt 2>/dev/null || echo "no cryptid" >> result.txt

          echo "" >> result.txt
          echo "=== 64-char hex strings (AES-256 key candidates) ===" >> result.txt
          strings "$BINARY" | grep -E "^[0-9a-fA-F]{64}$" >> result.txt || true

          echo "" >> result.txt
          echo "=== AES/crypto strings ===" >> result.txt
          strings "$BINARY" | grep -iE "aes|AES|cipher|OKSF|okuser|wallet.data|deviceKey|secureKey" | head -50 >> result.txt || true

          echo "" >> result.txt
          echo "=== OKX security class names ===" >> result.txt
          strings "$BINARY" | grep -E "OKW.*[Kk]ey|OKB.*[Kk]ey|OKSecure|OKCrypto|OKKeystore|OKWSec" | head -30 >> result.txt || true

          cp "$BINARY" OKX_binary
          cat result.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: okx-result
          path: |
            result.txt
            OKX_binary
          retention-days: 3
          if-no-files-found: warn
