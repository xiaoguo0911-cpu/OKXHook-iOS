name: Download and Analyze OKX IPA

on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: Apple ID
        required: true
      apple_pw:
        description: Apple Password
        required: true

jobs:
  analyze:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ipatool
        run: |
          brew tap majd/ipatool 2>&1 || true
          brew install ipatool
          ipatool --version

      - name: Login Download Analyze
        env:
          APPLE_ID: ${{ github.event.inputs.apple_id }}
          APPLE_PW: ${{ github.event.inputs.apple_pw }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== LOGIN ===" | tee result.txt
          ipatool auth login --email "$APPLE_ID" --password "$APPLE_PW" --non-interactive 2>&1 | tee -a result.txt

          echo "" | tee -a result.txt
          echo "=== DOWNLOAD ===" | tee -a result.txt
          ipatool download --bundle-identifier com.okx.wallet --output OKX.ipa --purchase 2>&1 | tee -a result.txt

          echo "" | tee -a result.txt
          if [ ! -f OKX.ipa ]; then
            echo "NO_IPA - download failed" | tee -a result.txt
          else
            echo "IPA: $(wc -c < OKX.ipa) bytes" | tee -a result.txt
            unzip -q OKX.ipa -d payload
            BINARY=$(find payload/Payload -maxdepth 2 -type f ! -path "*/Frameworks/*" ! -name "*.dylib" ! -name "*.car" ! -name "*.png" | head -1)
            echo "Binary: $BINARY ($(wc -c < "$BINARY") bytes)" | tee -a result.txt
            echo "" | tee -a result.txt
            echo "=== FairPlay cryptid ===" | tee -a result.txt
            otool -l "$BINARY" 2>/dev/null | grep -A3 cryptid | tee -a result.txt || echo "none" | tee -a result.txt
            echo "=== 64-hex candidates ===" | tee -a result.txt
            strings "$BINARY" | grep -E "^[0-9a-fA-F]{64}$" | tee -a result.txt || echo "none" | tee -a result.txt
            echo "=== crypto strings ===" | tee -a result.txt
            strings "$BINARY" | grep -iE "aes|OKSF|okuser|wallet\.data|deviceKey|OKCrypto|OKWSec|OKWallet.*[Kk]ey" | head -80 | tee -a result.txt || echo "none" | tee -a result.txt
          fi

          # 用 API 写入仓库
          CONTENT=$(base64 -i result.txt | tr -d '
')
          curl -s -X PUT "https://api.github.com/repos/${{ github.repository }}/contents/okx_result.txt"             -H "Authorization: Bearer $GH_TOKEN"             -H "Content-Type: application/json"             -d "{\"message\":\"okx analysis\",\"content\":\"$CONTENT\"}" | head -5
