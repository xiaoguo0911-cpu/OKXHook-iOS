name: Download and Analyze OKX IPA

on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: Apple ID
        required: true
      apple_pw:
        description: Apple Password
        required: true

jobs:
  analyze:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ipatool
        run: |
          brew tap majd/ipatool 2>&1 || true
          brew install ipatool
          ipatool --version

      - name: Login
        run: |
          ipatool auth login             --email "${{ github.event.inputs.apple_id }}"             --password "${{ github.event.inputs.apple_pw }}"             --non-interactive 2>&1 | tee login.log
          cat login.log

      - name: Download OKX
        run: |
          ipatool download             --bundle-identifier com.okx.wallet             --output OKX.ipa             --purchase 2>&1 | tee download.log
          echo "--- download result ---"
          ls -lh OKX.ipa 2>/dev/null || echo "No IPA file"

      - name: Analyze
        run: |
          {
            echo "=== login log ==="
            cat login.log 2>/dev/null || true
            echo "=== download log ==="
            cat download.log 2>/dev/null || true
            if [ ! -f OKX.ipa ]; then
              echo "NO_IPA"
            else
              echo "IPA size: $(wc -c < OKX.ipa)"
              unzip -q OKX.ipa -d payload 2>/dev/null || true
              BINARY=$(find payload/Payload -maxdepth 2 -type f                 ! -path "*/Frameworks/*" ! -name "*.dylib" ! -name "*.car"                 ! -name "*.png" ! -name "*.strings" 2>/dev/null | head -1)
              if [ -n "$BINARY" ]; then
                echo "Binary: $BINARY $(wc -c < "$BINARY") bytes"
                otool -l "$BINARY" 2>/dev/null | grep -A3 cryptid || echo "no cryptid"
                echo "=== 64-hex AES candidates ==="
                strings "$BINARY" | grep -E "^[0-9a-fA-F]{64}$" || echo "none"
                echo "=== crypto strings ==="
                strings "$BINARY" | grep -iE "aes|OKSF|okuser|wallet.data|deviceKey|OKCrypto|OKWSec" | head -50 || echo "none"
              fi
            fi
          } > result.txt 2>&1
          cat result.txt

      - name: Save result as file in repo
        run: |
          cp result.txt okx_result.txt
          git config user.email "bot@github.com"
          git config user.name "bot"
          git add okx_result.txt
          git diff --cached --quiet || git commit -m "okx result"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:main || true
