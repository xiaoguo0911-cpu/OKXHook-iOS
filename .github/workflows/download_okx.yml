name: Download and Analyze OKX IPA

on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: Apple ID
        required: true
      apple_pw:
        description: Apple Password
        required: true

jobs:
  analyze:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ipatool via brew
        run: |
          brew tap majd/ipatool 2>&1 || true
          brew install ipatool 2>&1
          ipatool --version

      - name: Login and download OKX
        run: |
          ipatool auth login             --email "${{ github.event.inputs.apple_id }}"             --password "${{ github.event.inputs.apple_pw }}"             --non-interactive 2>&1 || true

          ipatool download             --bundle-identifier com.okx.wallet             --output OKX.ipa 2>&1 || true

          ls -lh OKX.ipa 2>/dev/null || echo "No IPA"

      - name: Analyze
        run: |
          if [ ! -f OKX.ipa ]; then
            echo "NO_IPA" > result.txt; exit 0
          fi
          unzip -q OKX.ipa -d payload
          BINARY=$(find payload/Payload -maxdepth 2 -type f             ! -path "*/Frameworks/*" ! -name "*.dylib" ! -name "*.car"             ! -name "*.png" ! -name "*.strings" | head -1)
          echo "Binary: $BINARY $(wc -c < $BINARY) bytes" > result.txt
          otool -l "$BINARY" | grep -A2 cryptid >> result.txt 2>/dev/null || true
          echo "=== hex64 ===" >> result.txt
          strings "$BINARY" | grep -E "^[0-9a-fA-F]{64}$" >> result.txt || true
          echo "=== crypto ===" >> result.txt
          strings "$BINARY" | grep -iE "aes|OKSF|okuser|wallet\.data|deviceKey" | head -50 >> result.txt || true
          echo "=== okx security ===" >> result.txt
          strings "$BINARY" | grep -E "OKW.*[Kk]ey|OKB.*[Kk]ey|OKCrypto|OKSecure" | head -20 >> result.txt || true
          cp "$BINARY" OKX_binary
          cat result.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: okx-result
          path: |
            result.txt
            OKX_binary
          retention-days: 3
          if-no-files-found: warn
