name: OKX Analysis

on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: Apple ID
        required: true
      apple_pw:
        description: Apple Password
        required: true

jobs:
  analyze:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Run
        env:
          APPLE_ID: ${{ github.event.inputs.apple_id }}
          APPLE_PW: ${{ github.event.inputs.apple_pw }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          brew tap majd/ipatool 2>/dev/null || true
          brew install ipatool 2>/dev/null
          ipatool auth login --email "$APPLE_ID" --password "$APPLE_PW" --non-interactive > login.log 2>&1 || true
          cat login.log
          ipatool download --bundle-identifier com.okx.wallet --output OKX.ipa --purchase > dl.log 2>&1 || true
          cat dl.log
          echo '---RESULT---' > result.txt
          cat login.log >> result.txt
          cat dl.log >> result.txt
          if [ -f OKX.ipa ]; then
            echo "IPA: $(wc -c < OKX.ipa) bytes" >> result.txt
            unzip -q OKX.ipa -d payload 2>/dev/null || true
            BIN=$(find payload/Payload -maxdepth 2 -type f ! -path '*/Frameworks/*' ! -name '*.dylib' ! -name '*.car' ! -name '*.png' | head -1)
            echo "Binary: $BIN" >> result.txt
            otool -l "$BIN" 2>/dev/null | grep -A3 cryptid >> result.txt || true
            echo '=64hex=' >> result.txt
            strings "$BIN" | grep -E '^[0-9a-fA-F]{64}$' >> result.txt || true
            echo '=crypto=' >> result.txt
            strings "$BIN" | grep -iE 'aes|OKSF|okuser|deviceKey|OKCrypto|OKWSec' | head -60 >> result.txt || true
          else
            echo 'NO_IPA' >> result.txt
          fi
          cat result.txt
          ENC=$(base64 result.txt | tr -d '
')
          curl -s -X PUT "https://api.github.com/repos/$REPO/contents/okx_result.txt" \n            -H "Authorization: Bearer $GH_TOKEN" \n            -H "Content-Type: application/json" \n            -d "{\"message\":\"okx result\",\"content\":\"$ENC\"}" | python3 -c "import sys,json; r=json.load(sys.stdin); print(r.get('content',{}).get('name', r.get('message','?')))"
