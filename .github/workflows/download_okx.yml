name: Download and Analyze OKX IPA

on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: 'Apple ID (email)'
        required: true
      apple_pw:
        description: 'Apple ID password'
        required: true

jobs:
  download-analyze:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ipatool
        run: |
          brew install majd/ipatool/ipatool || \
          curl -sL https://github.com/majd/ipatool/releases/latest/download/ipatool-macos-arm64.tar.gz \
            -o ipatool.tar.gz && tar xzf ipatool.tar.gz
          ipatool --version 2>/dev/null || ./ipatool-macos-arm64 --version || true

      - name: Download OKX from App Store
        run: |
          # OKX Wallet bundle ID: com.okx.wallet (app ID: 6743309484)
          # OKX Exchange bundle ID: com.okx.exchange (app ID: 1327268470)

          ipatool auth login \
            --email "${{ github.event.inputs.apple_id }}" \
            --password "${{ github.event.inputs.apple_pw }}" \
            --non-interactive || true

          # 下载 OKX Wallet
          ipatool download \
            --bundle-identifier com.okx.wallet \
            --output OKX_Wallet.ipa || \
          ipatool download \
            --app-id 6743309484 \
            --output OKX_Wallet.ipa || true

          ls -lh *.ipa 2>/dev/null || echo "No IPA downloaded"

      - name: Extract and analyze binary
        run: |
          if [ ! -f OKX_Wallet.ipa ]; then
            echo "IPA not found"
            exit 1
          fi

          unzip -q OKX_Wallet.ipa -d OKX_extracted

          # 找主二进制
          BINARY=$(find OKX_extracted -name "OKX" -not -path "*/Frameworks/*" | head -1)
          if [ -z "$BINARY" ]; then
            BINARY=$(find OKX_extracted -type f -perm +111 | head -1)
          fi

          echo "Binary: $BINARY ($(wc -c < "$BINARY") bytes)"
          file "$BINARY"

          # 检查是否加密（FairPlay DRM）
          otool -l "$BINARY" | grep -A5 LC_ENCRYPTION_INFO || echo "No encryption info"

          # strings 搜索关键内容
          echo "=== 32-byte hex (AES key candidates) ===" > analysis.txt
          strings "$BINARY" | grep -E "^[0-9a-fA-F]{64}$" >> analysis.txt

          echo "=== Crypto-related strings ===" >> analysis.txt
          strings "$BINARY" | grep -iE "aes|cipher|encrypt|decrypt|pbkdf|OKSF|okuser|wallet.data|secureKey|hardcode" >> analysis.txt

          echo "=== OKX security class names ===" >> analysis.txt
          strings "$BINARY" | grep -iE "OKWSec|OKBSec|OKCrypto|OKKeystore|OKWallet.*[Kk]ey|OKSecure|OKSF" >> analysis.txt

          echo "=== ObjC class names ===" >> analysis.txt
          otool -ov "$BINARY" 2>/dev/null | grep -iE "class.*[Kk]ey|class.*[Cc]rypto|class.*[Ee]ncrypt" >> analysis.txt

          cat analysis.txt

          # 上传二进制供进一步分析
          cp "$BINARY" ./OKX_binary

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: okx-analysis
          path: |
            analysis.txt
            OKX_binary
          retention-days: 3
